[project]
name = "pyinkr"
version = "0.3.0"
description = "A tool for managing MKV files"
authors = [{ name = "xMohnad" }]

dependencies = [
  "fonttools>=4.63.0",
  "platformdirs>=4.11.0",
  "pymkv2>=2.1.1",
  "textual>=2.1.2",
  "textual_fspicker>=0.4.1",
  "typing_extensions>=4.12.0",
]

readme = "README.md"
license = "MIT"
requires-python = ">=3.10"

classifiers = [
  "Environment :: Console",
  "Development Status :: 4 - Beta",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Terminals",
  "Topic :: Multimedia :: Video",
  "Typing :: Typed",
]

keywords = ["terminal"]

[project.urls]
Homepage = "https://github.com/xMohnad/Inkr"
Repository = "https://github.com/xMohnad/Inkr"
Issues = "https://github.com/xMohnad/Inkr/issues"

[tool.uv]
managed = true

[dependency-groups]
dev = ["textual-dev>=1.7.0"]

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["uv_build>=0.11.30,<0.12"]
build-backend = "uv_build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyinkr"]

[project.scripts]
inkr = "pyinkr.main:main"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# D1xx: missing-docstring rules. D100 (missing docstring in public module)
# is intentionally excluded — module-level docstrings aren't required.
# Private names (leading underscore) are excluded by pydocstyle by
# default, matching this project's convention that internal helper
# methods don't require docstrings.
# D401: docstrings should start with an imperative verb ("Return the...",
# not "Returns the...").
select = [
  "F401",
  "D101",
  "D102",
  "D103",
  "D104",
  "D105",
  "D106",
  "D107",
  "D401",
  "D419",
  "I",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
reportImplicitOverride = true
deprecateTypingAliases = true
reportMissingTypeArgument = true
reportUnusedCallResult = false
reportImportCycles = false
reportMissingParameterType = "warning"
typeCheckingMode = "standard"
